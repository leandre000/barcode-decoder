<!DOCTYPE html>
    <!-- Commit 57 -->
<html lang="en">
    <!-- Commit 31 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Decoder - Professional Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <i class="fas fa-barcode"></i>
                    Barcode Decoder
                </h1>
                <p class="tagline">Professional barcode decoding with Aztec & Data Matrix support</p>
            </div>
        </header>

        <main class="main-content">
            <div class="upload-section">
                <div class="upload-card">
                    <div class="upload-area" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <h3>Drop your image here</h3>
                        <p>or click to browse</p>
                        <input type="file" id="fileInput" accept="image/*" multiple>
                        <div class="supported-formats">
                            <span>Supported: PNG, JPG, JPEG, GIF, BMP, WEBP</span>
                        </div>
                    </div>
                    <div class="preview-container" id="previewContainer" style="display: none;">
                        <img id="previewImage" alt="Preview">
                        <button class="btn-remove" id="removeImage">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <div class="options-panel">
                    <div class="option-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="enhanceImage" checked>
                            <span>Enhance Image Quality</span>
                        </label>
                    </div>
                    <div class="option-group">
                        <label for="formatFilter">Filter by Format:</label>
                        <select id="formatFilter" multiple>
                            <option value="">All Formats</option>
                            <option value="AZTEC">Aztec</option>
                            <option value="DATA_MATRIX">Data Matrix</option>
                            <option value="QR_CODE">QR Code</option>
                            <option value="CODE128">Code 128</option>
                            <option value="CODE39">Code 39</option>
                            <option value="EAN13">EAN-13</option>
                        </select>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="decodeBtn" disabled>
                        <i class="fas fa-search"></i>
                        Decode Barcode
                    </button>
                    <button class="btn btn-secondary" id="batchBtn" disabled>
                        <i class="fas fa-layer-group"></i>
                        Batch Process
                    </button>
                    <button class="btn btn-outline" id="clearBtn">
                        <i class="fas fa-redo"></i>
                        Clear
                    </button>
                </div>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <div class="results-header">
                    <h2>
                        <i class="fas fa-check-circle"></i>
                        Decoding Results
                    </h2>
                    <div class="results-count" id="resultsCount"></div>
                </div>
                <div class="results-container" id="resultsContainer"></div>
            </div>

            <div class="loading-overlay" id="loadingOverlay" style="display: none;">
                <div class="spinner"></div>
                <p>Processing image...</p>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2025 Barcode Decoder. Professional barcode decoding tool.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
